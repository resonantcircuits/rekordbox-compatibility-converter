name: CI & Release Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, python-version: '3.9' }
          - { os: ubuntu-latest, python-version: '3.10' }
          - { os: ubuntu-latest, python-version: '3.11' }
          - { os: ubuntu-latest, python-version: '3.12' }
          - { os: ubuntu-latest, python-version: '3.13' }
          - { os: ubuntu-latest, python-version: '3.14' }
          - { os: macos-latest, python-version: '3.9' }
          - { os: macos-latest, python-version: '3.14' }
          - { os: windows-latest, python-version: '3.9' }
          - { os: windows-latest, python-version: '3.14' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          if brew tap | grep -Fxq aws/tap
          then
            brew untap aws/tap
          fi
          brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run test suite
        run: uv run --frozen --extra dev pytest -v

  build-executables:
    name: Build Desktop App (${{ matrix.asset_suffix }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            asset_suffix: macOS-arm64
          - os: macos-15-intel
            platform: macos
            asset_suffix: macOS-x86_64
          - os: windows-2025
            platform: windows
            asset_suffix: Windows-x86_64

    env:
      BUILD_LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('test-{0}', github.run_number) }}
      RBCONVERT_SMOKE_TEST: conversion

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies & PyInstaller
        run: uv sync --frozen --extra dev --python 3.11

      - name: Restore minimal FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            build-vendor/minimal-ffmpeg/bin
            build-vendor/minimal-ffmpeg/legal
            build-vendor/minimal-ffmpeg/corresponding-source.tar.gz
          key: minimal-ffmpeg-v1-${{ matrix.asset_suffix }}-${{ hashFiles('packaging/ffmpeg/build_minimal_ffmpeg.sh', 'packaging/ffmpeg/versions.env', 'packaging/ffmpeg/CORRESPONDING_SOURCE_README.md') }}

      - name: Install NASM (macOS Intel)
        if: matrix.asset_suffix == 'macOS-x86_64' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          if brew tap | grep -Fxq aws/tap
          then
            brew untap aws/tap
          fi
          brew install nasm

      - name: Set up MSYS2 build tools
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib

      - name: Build minimal bundled FFmpeg (macOS)
        if: matrix.platform == 'macos' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: packaging/ffmpeg/build_minimal_ffmpeg.sh "$PWD/build-vendor/minimal-ffmpeg"

      - name: Configure bundled FFmpeg environment (macOS)
        if: matrix.platform == 'macos'
        run: |
          SOURCE_ARCHIVE_NAME="RekordboxFormatChecker-${BUILD_LABEL}-FFmpeg-Sources.tar.gz"
          test -x "$PWD/build-vendor/minimal-ffmpeg/bin/ffmpeg"
          test -x "$PWD/build-vendor/minimal-ffmpeg/bin/ffprobe"
          test -d "$PWD/build-vendor/minimal-ffmpeg/legal"
          test -f "$PWD/build-vendor/minimal-ffmpeg/corresponding-source.tar.gz"
          "$PWD/build-vendor/minimal-ffmpeg/bin/ffmpeg" -version
          echo "RBCONVERT_FFMPEG_PATH=$PWD/build-vendor/minimal-ffmpeg/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "RBCONVERT_FFPROBE_PATH=$PWD/build-vendor/minimal-ffmpeg/bin/ffprobe" >> "$GITHUB_ENV"
          echo "RBCONVERT_FFMPEG_LEGAL_DIR=$PWD/build-vendor/minimal-ffmpeg/legal" >> "$GITHUB_ENV"
          echo "RBCONVERT_SOURCE_ARCHIVE_NAME=$SOURCE_ARCHIVE_NAME" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RBCONVERT_SOURCE_DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$SOURCE_ARCHIVE_NAME" >> "$GITHUB_ENV"
          else
            echo "RBCONVERT_SOURCE_DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          fi

      - name: Build minimal bundled FFmpeg (Windows)
        if: matrix.platform == 'windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: packaging/ffmpeg/build_minimal_ffmpeg.sh "$PWD/build-vendor/minimal-ffmpeg"

      - name: Configure bundled FFmpeg environment (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          SOURCE_ARCHIVE_NAME="RekordboxFormatChecker-${BUILD_LABEL}-FFmpeg-Sources.tar.gz"
          test -x "$PWD/build-vendor/minimal-ffmpeg/bin/ffmpeg.exe"
          test -x "$PWD/build-vendor/minimal-ffmpeg/bin/ffprobe.exe"
          test -d "$PWD/build-vendor/minimal-ffmpeg/legal"
          test -f "$PWD/build-vendor/minimal-ffmpeg/corresponding-source.tar.gz"
          "$PWD/build-vendor/minimal-ffmpeg/bin/ffmpeg.exe" -version
          echo "RBCONVERT_FFMPEG_PATH=$(cygpath -w "$PWD/build-vendor/minimal-ffmpeg/bin/ffmpeg.exe")" >> "$GITHUB_ENV"
          echo "RBCONVERT_FFPROBE_PATH=$(cygpath -w "$PWD/build-vendor/minimal-ffmpeg/bin/ffprobe.exe")" >> "$GITHUB_ENV"
          echo "RBCONVERT_FFMPEG_LEGAL_DIR=$(cygpath -w "$PWD/build-vendor/minimal-ffmpeg/legal")" >> "$GITHUB_ENV"
          echo "RBCONVERT_SOURCE_ARCHIVE_NAME=$SOURCE_ARCHIVE_NAME" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RBCONVERT_SOURCE_DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$SOURCE_ARCHIVE_NAME" >> "$GITHUB_ENV"
          else
            echo "RBCONVERT_SOURCE_DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          fi

      - name: Smoke-test GUI entrypoint import
        run: uv run --frozen --extra dev python -c "from rekordbox_compatibility_converter.gui.app import main; assert callable(main)"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen --extra dev python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; expected = 'v' + version; actual = os.environ['RELEASE_TAG']; assert actual == expected, 'tag %r does not match package version %s' % (actual, expected)"

      - name: Build macOS App
        if: matrix.platform == 'macos'
        run: uv run --frozen --extra dev pyinstaller --noconfirm --clean packaging/RekordboxFormatChecker.spec

      - name: Smoke-test macOS App
        if: matrix.platform == 'macos'
        run: |
          env PATH=/usr/bin:/bin:/usr/sbin:/sbin RBCONVERT_SMOKE_TEST=gui-threading dist/RekordboxFormatChecker.app/Contents/MacOS/RekordboxFormatChecker
          env PATH=/usr/bin:/bin:/usr/sbin:/sbin RBCONVERT_SMOKE_TEST=conversion dist/RekordboxFormatChecker.app/Contents/MacOS/RekordboxFormatChecker

      - name: Package macOS App
        if: matrix.platform == 'macos'
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent dist/RekordboxFormatChecker.app "release-assets/RekordboxFormatChecker-${BUILD_LABEL}-${{ matrix.asset_suffix }}.zip"

      - name: Package shared FFmpeg corresponding source
        if: matrix.asset_suffix == 'macOS-arm64'
        run: |
          mkdir -p release-assets
          cp build-vendor/minimal-ffmpeg/corresponding-source.tar.gz "release-assets/$RBCONVERT_SOURCE_ARCHIVE_NAME"

      - name: Build Windows Exe
        if: matrix.platform == 'windows'
        run: uv run --frozen --extra dev pyinstaller --noconfirm --clean packaging/RekordboxFormatChecker.spec

      - name: Smoke-test Windows Exe
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:Path = "$env:SystemRoot\System32"
          $env:RBCONVERT_SMOKE_TEST = "gui-threading"
          $process = Start-Process -FilePath "dist/RekordboxFormatChecker.exe" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged GUI threading smoke test exited with code $($process.ExitCode)" }
          $env:RBCONVERT_SMOKE_TEST = "conversion"
          $process = Start-Process -FilePath "dist/RekordboxFormatChecker.exe" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged conversion smoke test exited with code $($process.ExitCode)" }

      - name: Package Windows Exe
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets
          Copy-Item "dist/RekordboxFormatChecker.exe" "release-assets/RekordboxFormatChecker-$env:BUILD_LABEL-${{ matrix.asset_suffix }}.exe"

      - name: Upload packaged executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.asset_suffix }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build-executables
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum RekordboxFormatChecker-* > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
