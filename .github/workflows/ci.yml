name: CI & Release Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run test suite
        run: uv run pytest -v

  build-executables:
    name: Build Standalone Binary (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies & PyInstaller
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install pyinstaller

      - name: Build macOS App
        if: runner.os == 'macOS'
        run: |
          uv run pyinstaller --noconfirm --onedir --windowed --name "RekordboxFormatChecker" \
            --collect-all customtkinter \
            rekordbox_compatibility_converter/gui/app.py
          cd dist && zip -r RekordboxFormatChecker-macOS.zip RekordboxFormatChecker.app

      - name: Build Windows Exe
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller --noconfirm --onefile --windowed --name "RekordboxFormatChecker" `
            --collect-all customtkinter `
            rekordbox_compatibility_converter/gui/app.py

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RekordboxFormatChecker-macOS.zip
            dist/RekordboxFormatChecker.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
