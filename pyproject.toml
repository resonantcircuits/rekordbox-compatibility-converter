[project]
name = "rekordbox-format-checker"
version = "0.2.0"
description = "A fast, cross-platform CLI and modern GUI utility to convert Rekordbox USB exports to CDJ-compatible audio formats with database and waveform synchronization."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "mutagen>=1.47.0",
    "customtkinter>=6.0.0",
    "darkdetect>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyrekordbox>=0.4.0",
    "sqlcipher3-wheels>=0.5.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
rekordbox-format-checker = "rekordbox_format_checker.cli.main:cli"
rbcheck = "rekordbox_format_checker.cli.main:cli"
rbcheck-gui = "rekordbox_format_checker.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rekordbox_format_checker"]
